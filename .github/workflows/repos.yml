name: Repositories

# Подписанные репозитории APT и pacman на GitHub Pages из последнего релиза,
# затем проверка установки в чистых Ubuntu, Kali и Arch.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  KEY_ID: 643C6DE601D4BBB661D5322AF2F379CD75CF5C03

jobs:
  arch:
    # Только после настоящего релиза по тегу (тестовые ручные сборки пропускаем).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
    steps:
      - run: pacman -Syu --noconfirm --needed github-cli
      - name: Репозиторий pacman
        run: |
          mkdir -p repo && cd repo
          gh release download --repo "$GITHUB_REPOSITORY" --pattern axiom-x86_64.pkg.tar.zst
          INFO=$(bsdtar -xOf axiom-x86_64.pkg.tar.zst .PKGINFO)
          NAME=$(printf '%s\n' "$INFO" | sed -n 's/^pkgname = //p')
          VER=$(printf '%s\n' "$INFO" | sed -n 's/^pkgver = //p')
          PKG="$NAME-$VER-x86_64.pkg.tar.zst"
          mv axiom-x86_64.pkg.tar.zst "$PKG"
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --local-user "$KEY_ID" --detach-sign "$PKG"
          repo-add --sign --key "$KEY_ID" axiom.db.tar.gz "$PKG"
          # GitHub Pages не хранит симлинки — заменяем их копиями.
          for f in axiom.db axiom.files axiom.db.sig axiom.files.sig; do
            if [ -L "$f" ]; then cp --remove-destination "$(readlink -f "$f")" "$f"; fi
          done
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-repo
          path: repo/

  site:
    needs: arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Репозиторий APT
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
          POOL=site/apt/pool/main/a/axiom-browser
          mkdir -p "$POOL"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern axiom_amd64.deb --dir "$POOL"
          NAME=$(dpkg-deb -f "$POOL/axiom_amd64.deb" Package)
          VER=$(dpkg-deb -f "$POOL/axiom_amd64.deb" Version)
          mv "$POOL/axiom_amd64.deb" "$POOL/${NAME}_${VER}_amd64.deb"
          cd site/apt
          mkdir -p dists/stable/main/binary-amd64
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -9kf dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Axiom \
            -o APT::FTPArchive::Release::Label=Axiom \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            -o "APT::FTPArchive::Release::Description=Axiom browser" \
            release dists/stable > Release.tmp
          mv Release.tmp dists/stable/Release
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --local-user "$KEY_ID" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --local-user "$KEY_ID" --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: arch-repo
          path: site/arch/x86_64
      - name: Страница и ключ
        run: |
          cp packaging/keys/axiom.asc packaging/keys/axiom.gpg packaging/site/index.html assets/logo.svg install.sh site/
          touch site/.nojekyll
          find site -type f | sort
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      # GitHub иногда отдаёт список артефактов запуска с задержкой, и деплой не видит
      # только что загруженный github-pages («No artifacts named github-pages»).
      # Пауза перед деплоем и вторая попытка через минуту.
      - name: Пауза перед деплоем
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true
      - name: Пауза перед повтором
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify:
    needs: site
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "kalilinux/kali-rolling", "archlinux:latest"]
        mode: ["default"]
        # На Arch скрипт по умолчанию собирает axiom-browser-bin по PKGBUILD для AUR,
        # а с AXIOM_ARCH_REPO=1 подключает репозиторий [axiom]. Проверяем оба пути.
        include:
          - image: "archlinux:latest"
            mode: "repo"
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Установка скриптом и проверка
        env:
          DEBIAN_FRONTEND: noninteractive
          AXIOM_ARCH_REPO: ${{ matrix.mode == 'repo' && '1' || '' }}
          # PKGBUILD из того же коммита, что и install.sh.
          AXIOM_PKGBUILD_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/packaging/aur/axiom-browser-bin/PKGBUILD
        run: |
          if command -v pacman >/dev/null 2>&1; then
            pacman -Syu --noconfirm --needed curl
          else
            # archive.ubuntu.com из контейнеров GitHub бывает очень медленным — берём зеркало Azure.
            sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
            apt-get update && apt-get install -y curl ca-certificates
          fi
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh" | sh
          test -x /usr/bin/axiom-browser
          test -f /usr/share/applications/axiom-browser.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/axiom-browser.png
          if ldd /usr/bin/axiom-browser | grep "not found"; then exit 1; fi
          # Поставился именно наш браузер, а не одноимённый пакет дистрибутива.
          if command -v dpkg-query >/dev/null 2>&1; then
            dpkg-query -W -f '${Package} ${Version} ${Maintainer}\n' axiom-browser | tee /dev/stderr | grep -q "Axiom contributors"
          elif [ -n "$AXIOM_ARCH_REPO" ]; then
            pacman -Qi axiom-browser | grep -E "^(Name|Version|URL)"
          else
            pacman -Qi axiom-browser-bin | grep -E "^(Name|Version|URL)"
          fi
          echo "Axiom установлен и все библиотеки на месте"
