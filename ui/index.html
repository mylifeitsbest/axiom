<!doctype html>
<html lang="ru" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- У интерфейса своя тёмная и светлая тема: принудительное затемнение сайтов его не трогает -->
<meta name="color-scheme" content="light dark">
<title>Axiom</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="history.css">
<style id="userCss"></style>
</head>
<body>
<div id="app" class="app" data-layout="one">
  <header class="bar" id="row1" data-drag></header>
  <div class="bar row2" id="row2" data-drag></div>

  <div class="main" id="main">
    <aside class="side" id="side" data-drag>
      <div class="side-top" id="sideTop" data-drag></div>
    </aside>

    <section class="content nt" id="content">
      <div class="newtab" id="newtab">
        <div class="nt-bg"><i class="nt-glow"></i></div>
        <div class="nt-main">
          <div class="clock" id="clock"></div>
          <div class="date" id="date"></div>
          <div class="nt-search" id="ntSearch">
            <span data-i="search"></span>
            <input id="ntInput" type="text" spellcheck="false" autocomplete="off" placeholder="Поиск или адрес" aria-label="Поиск или адрес">
          </div>
          <div class="tiles" id="tiles"></div>
          <div class="nt-empty" id="ntEmpty" hidden></div>
        </div>
        <div class="nt-undo" id="ntUndo" role="status"></div>
      </div>
      <div class="sleeping" id="sleeping">
        <span class="wk-fav" id="wakeFav"></span>
        <span class="wk-name" id="wakeName"></span>
        <span class="wk-note"><span data-i="moon"></span>Просыпается…</span>
      </div>
    </section>

    <div class="resizer" id="aiResizer" title="Потяните, чтобы изменить ширину"></div>
    <aside class="ai" id="ai">
      <div class="ai-head">
        <span class="ai-title"><span data-i="sparkles"></span>AI Mode</span>
        <span class="pdot" id="pdot"></span>
        <span class="grow"></span>
        <button class="ib sm" id="aiPop" title="Открыть во вкладке" data-i="popout"></button>
        <button class="ib sm" id="aiClose" title="Закрыть (Ctrl+K)" data-i="x"></button>
      </div>
      <div class="ai-body" id="aiBody"><div class="ai-skel"><i></i><i></i><i></i><i></i></div></div>
    </aside>

    <section class="sheet" id="sheet" aria-label="Настройки"></section>
  </div>

  <section class="onb" id="onb" aria-label="Добро пожаловать"></section>

  <div class="sug" id="sug" role="listbox"></div>

  <div class="dlp" id="dlp" role="dialog" aria-label="Загрузки">
    <div class="dlp-head">
      <b>Загрузки</b>
      <button class="lnk" data-h="folder" title="Открыть папку «Загрузки»"><span data-i="folder"></span>Папка</button>
      <button class="lnk" id="dlClear" data-h="clear" title="Убрать завершённые из списка">Очистить</button>
    </div>
    <div class="dlp-list" id="dlList"></div>
  </div>

  <div class="dlp upp" id="upp" role="dialog" aria-label="Обновление Axiom"></div>

  <div class="dlp upp ansp" id="ansp" role="dialog" aria-label="Ответ разработчика"></div>

  <div class="dlp trp" id="trp" role="dialog" aria-label="Перевод страницы"></div>

  <div class="dlp xap" id="xap" role="dialog" aria-label="Открыть приложение"></div>

  <div class="dlp xap pmp" id="pmp" role="dialog" aria-label="Запрос разрешения"></div>

  <div class="dlp trp pmc" id="pmc" role="dialog" aria-label="Сведения о сайте"></div>

  <div class="dlp zmp" id="zmp" role="dialog" aria-label="Масштаб страницы"></div>

  <div class="edge n" data-edge="n"></div><div class="edge s" data-edge="s"></div>
  <div class="edge e" data-edge="e"></div><div class="edge w" data-edge="w"></div>
  <div class="edge ne" data-edge="ne"></div><div class="edge nw" data-edge="nw"></div>
  <div class="edge se" data-edge="se"></div><div class="edge sw" data-edge="sw"></div>
</div>

<!-- Части интерфейса: app.js раскладывает их по строкам или в боковую панель -->
<div id="parts" hidden>
  <div class="nav" id="nav">
    <button class="ib" data-act="back" title="Назад (Alt+←)" data-i="back"></button>
    <button class="ib" data-act="forward" title="Вперёд (Alt+→)" data-i="fwd"></button>
    <button class="ib" data-act="reload" title="Обновить (F5)" data-i="reload"></button>
  </div>
  <div class="tabs" id="tabs" data-drag>
    <div class="tablist" id="tablist" role="tablist" data-drag></div>
    <button class="ib nt-btn" id="newTabBtn" title="Новая вкладка (Ctrl+T)"><span data-i="plus"></span><span class="nt-label">Новая вкладка</span></button>
  </div>
  <div class="omni" id="omni">
    <span class="omni-ic" id="omniIc"></span>
    <span class="omni-field">
      <input id="omniInput" type="text" spellcheck="false" autocomplete="off" placeholder="Поиск или адрес" aria-label="Адресная строка">
      <span class="omni-view" id="omniView"></span>
      <span class="omni-msg" id="omniMsg" role="status"></span>
    </span>
    <button class="ib pm" id="permBtn" hidden></button>
    <button class="ib zm" id="zoomBtn" title="Масштаб" data-i="zoomIn" hidden></button>
    <button class="ib tr" id="trBtn" title="Перевести страницу" data-i="translate" hidden></button>
    <button class="ib awake" id="awakeBtn" title="Не усыплять вкладку" data-i="cup" aria-pressed="false" hidden></button>
    <button class="ib star" id="starBtn" title="Добавить в закладки (Ctrl+D)" data-i="star" aria-pressed="false" hidden></button>
    <button class="ib ds" id="dsBtn" title="Двойной поиск" data-i="spark" aria-pressed="false"></button>
  </div>
  <div class="acts" id="acts">
    <button class="upd ans" id="ansBtn" hidden><span data-i="chat"></span><span class="upd-t">Вам ответили</span></button>
    <button class="upd" id="updBtn" hidden><span data-i="up"></span><span class="upd-t">Обновить</span></button>
    <button class="ib dl" id="dlBtn" title="Загрузки (Ctrl+J)" hidden>
      <span class="dl-rg" aria-hidden="true">
        <svg class="ring" viewBox="0 0 28 28"><circle class="rt" cx="14" cy="14" r="12"/><circle class="rp" cx="14" cy="14" r="12" pathLength="100"/></svg>
        <i class="dl-comet"></i>
      </span>
      <span class="dl-ic" data-i="download"></span>
      <span class="dl-ok" data-i="check" aria-hidden="true"></span>
    </button>
    <button class="ib" id="aiBtn" title="AI Mode (Ctrl+K)" data-i="sparkles"></button>
    <button class="ib" id="setBtn" title="Настройки (Ctrl+,)" data-i="sliders"></button>
  </div>
  <div class="wc" id="wc">
    <button data-win="minimize" title="Свернуть" data-cap="min"></button>
    <button data-win="maximize" title="Развернуть" data-cap="max"></button>
    <button data-win="close" class="close" title="Закрыть" data-cap="x"></button>
  </div>
  <div class="grow" id="growA" data-drag></div>
</div>

<script src="icons.js"></script>
<script src="settings.js"></script>
<script src="downloads.js"></script>
<script src="island.js"></script>
<script src="update.js"></script>
<script src="answers.js"></script>
<script src="translate.js"></script>
<script src="zoom.js"></script>
<script src="snapshot.js"></script>
<script src="newtab.js"></script>
<script src="history.js"></script>
<script src="tabmenu.js"></script>
<script src="applink.js"></script>
<script src="permissions.js"></script>
<script src="app.js"></script>
</body>
</html>
