[package]
name = "axiom"
version = "0.5.5"
edition = "2024"
description = "Лёгкий десктопный браузер на Rust: минимум памяти, DuckDuckGo и панель Google AI Mode"
repository = "https://github.com/mylifeitsbest/axiom"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.105"
directories = "6.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Проверка скачанного обновления по SHA256SUMS.txt (та же версия, что у wry).
sha2 = "0.10.9"
tao = "0.37.3"
thiserror = "2.0.21"
url = "2.5.9"
# devtools: F12 и Ctrl+Shift+I открывают инструменты разработчика и в release-сборке.
wry = { version = "0.57.3", features = ["devtools"] }

[target.'cfg(windows)'.dependencies]
# Та же версия, что использует wry: нужна для перехвата горячих клавиш внутри страниц.
webview2-com = "0.39"
# Поток в памяти для снимка страницы (CapturePreview); те же версия и возможности, что у wry.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }
windows-core = "0.62"
windows-registry = "0.100.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Та же версия, что у tao и wry: контейнер для webview и горячие клавиши.
gtk = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Пакет для Debian, Ubuntu и Kali: `cargo deb --no-build` после `cargo build --release`.
# Имя `axiom-browser`: в Debian уже есть пакет `axiom` (система компьютерной алгебры).
[package.metadata.deb]
name = "axiom-browser"
# Наш первый .deb (0.2.0) назывался `axiom`; система алгебры с версией 2021xxxx под условие не попадает.
replaces = "axiom (<< 0.2.1)"
breaks = "axiom (<< 0.2.1)"
maintainer = "Axiom contributors <192708983+mylifeitsbest@users.noreply.github.com>"
copyright = "2026, Axiom contributors"
section = "web"
priority = "optional"
depends = "$auto, xdg-utils, curl"
extended-description = """\
Лёгкий браузер на Rust и системном WebView (WebKitGTK). Двойной поиск: \
DuckDuckGo во вкладке и Google AI Mode в боковой панели, прокси только для \
панели ИИ, спящие вкладки и тонкая настройка внешнего вида."""
assets = [
    ["target/release/axiom", "usr/bin/axiom-browser", "755"],
    ["packaging/linux/axiom-browser.desktop", "usr/share/applications/", "644"],
    ["assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/axiom-browser.svg", "644"],
    ["assets/linux/axiom-16.png", "usr/share/icons/hicolor/16x16/apps/axiom-browser.png", "644"],
    ["assets/linux/axiom-24.png", "usr/share/icons/hicolor/24x24/apps/axiom-browser.png", "644"],
    ["assets/linux/axiom-32.png", "usr/share/icons/hicolor/32x32/apps/axiom-browser.png", "644"],
    ["assets/linux/axiom-48.png", "usr/share/icons/hicolor/48x48/apps/axiom-browser.png", "644"],
    ["assets/linux/axiom-64.png", "usr/share/icons/hicolor/64x64/apps/axiom-browser.png", "644"],
    ["assets/linux/axiom-128.png", "usr/share/icons/hicolor/128x128/apps/axiom-browser.png", "644"],
    ["assets/linux/axiom-256.png", "usr/share/icons/hicolor/256x256/apps/axiom-browser.png", "644"],
    ["assets/linux/axiom-512.png", "usr/share/icons/hicolor/512x512/apps/axiom-browser.png", "644"],
]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
