[package]
name = "axiom"
version = "0.1.0"
edition = "2024"
description = "Лёгкий десктопный браузер на Rust: минимум памяти, DuckDuckGo и панель Google AI Mode"
repository = "https://github.com/mylifeitsbest/axiom"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.105"
directories = "6.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.3"
thiserror = "2.0.21"
url = "2.5.9"
wry = "0.57.3"

[target.'cfg(windows)'.dependencies]
# Та же версия, что использует wry: нужна для перехвата горячих клавиш внутри страниц.
webview2-com = "0.39"
windows-core = "0.62"
windows-registry = "0.100.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
