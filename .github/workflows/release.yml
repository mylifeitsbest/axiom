name: Release

# Тег vX.Y.Z → сборки для Windows, Debian/Ubuntu/Kali и Arch → GitHub Releases.
# Ручной запуск без тега только собирает пакеты (артефакты рабочего процесса).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (vX.Y.Z). Пусто — только сборка"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked
      - name: Упаковка
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/axiom.exe dist/Axiom-windows-x64.exe
          Compress-Archive -Path target/release/axiom.exe, README.md -DestinationPath dist/Axiom-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/*

  debian:
    # Сборка на старейшей поддерживаемой базе: пакет ставится на Ubuntu 22.04+, Debian 12+ и Kali.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deb
      - name: Пакет .deb и архив
        run: |
          cargo deb --no-build
          mkdir -p dist stage/axiom
          cp target/debian/axiom-browser_*_amd64.deb dist/axiom_amd64.deb
          install -Dm755 target/release/axiom stage/axiom/axiom-browser
          install -Dm644 packaging/linux/axiom-browser.desktop stage/axiom/axiom-browser.desktop
          install -Dm644 assets/logo.svg stage/axiom/icons/axiom-browser.svg
          cp assets/linux/*.png stage/axiom/icons/
          cp README.md stage/axiom/
          tar -C stage -czf dist/axiom-linux-x86_64.tar.gz axiom
          dpkg-deb --info dist/axiom_amd64.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian
          path: dist/*

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Зависимости
        run: pacman -Syu --noconfirm --needed git rust webkit2gtk-4.1 gtk3 libsoup3 xdg-utils hicolor-icon-theme gst-plugins-good gst-libav
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          sed -i "s/^pkgver=.*/pkgver=$VER/" packaging/arch/PKGBUILD
          git archive --format=tar.gz --prefix="axiom-$VER/" -o "packaging/arch/axiom-browser-$VER.tar.gz" HEAD
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder -H bash -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm -f"
          mkdir -p dist
          cp packaging/arch/axiom-browser-"$VER"-*-x86_64.pkg.tar.zst dist/axiom-x86_64.pkg.tar.zst
          pacman -Qip dist/axiom-x86_64.pkg.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch
          path: dist/*

  aur:
    # PKGBUILD для AUR (axiom-browser-bin) качает архив из релиза, а релиза ещё нет.
    # Поэтому подставляем архив, собранный выше в задаче debian, — его же и опубликуют.
    # Артефактов не выгружает: publish собирает в релиз все артефакты подряд.
    needs: debian
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Зависимости
        run: pacman -Syu --noconfirm --needed git namcap
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: debian
          path: dist
      - name: makepkg -si и namcap
        shell: bash
        run: |
          AUR="$GITHUB_WORKSPACE/packaging/aur/axiom-browser-bin"
          useradd -m builder
          # makepkg — от обычного пользователя, как у людей: зависимости и пакет ставит sudo pacman.
          echo 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"
          as_builder() { sudo -u builder -H bash -c "cd '$AUR' && $1"; }
          echo "::group::.SRCINFO совпадает с PKGBUILD"
          as_builder "makepkg --printsrcinfo" | diff -u "$AUR/.SRCINFO" -
          echo "::endgroup::"
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          SUM=$(sha256sum dist/axiom-linux-x86_64.tar.gz | cut -d' ' -f1)
          sudo -u builder sh packaging/aur/bump.sh "$VER" "$SUM"
          as_builder "makepkg --printsrcinfo" | diff -u "$AUR/.SRCINFO" -
          # Архив под именем из source=(): makepkg найдёт его рядом с PKGBUILD и не станет качать.
          sudo -u builder cp dist/axiom-linux-x86_64.tar.gz "$AUR/axiom-browser-bin-$VER.tar.gz"
          as_builder "makepkg -si --noconfirm"
          test -x /usr/bin/axiom-browser
          test -f /usr/share/applications/axiom-browser.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/axiom-browser.svg
          test -f /usr/share/icons/hicolor/256x256/apps/axiom-browser.png
          if ldd /usr/bin/axiom-browser | grep "not found"; then exit 1; fi
          pacman -Qi axiom-browser-bin
          # namcap — для сведения: на license=('custom') без файла лицензии он ругается всегда.
          namcap "$AUR/PKGBUILD" "$AUR"/axiom-browser-bin-"$VER"-*.pkg.tar.zst || true
          {
            echo "### AUR: axiom-browser-bin $VER"
            echo "SHA-256 архива: \`$SUM\`. После публикации релиза: \`sh packaging/aur/bump.sh $VER\`, затем push в AUR (packaging/aur/README.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [windows, debian, arch]
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Контрольные суммы
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Публикация
        run: |
          cat > notes.md <<'EOF'
          ## Установка

          **Windows** — скачайте `Axiom-windows-x64.exe` и запустите, или в PowerShell:
          ```powershell
          irm https://raw.githubusercontent.com/mylifeitsbest/axiom/main/install.ps1 | iex
          ```

          **Linux одной командой** (Ubuntu, Debian, Kali, Arch). На Ubuntu, Debian и Kali подключит
          подписанный репозиторий, обновления придут через `apt upgrade`. На Arch поставит
          `axiom-browser-bin` из AUR без обновления системы:
          ```sh
          curl -fsSL https://raw.githubusercontent.com/mylifeitsbest/axiom/main/install.sh | sh
          ```

          **Arch из AUR:** `yay -S axiom-browser-bin`.

          Ручная настройка репозиториев: https://mylifeitsbest.github.io/axiom/
          Пакет на Linux называется `axiom-browser` (в AUR — `axiom-browser-bin`), команда запуска — `axiom-browser`.

          EOF
          # Latest — только самая новая версия. Иначе перевыпуск старого тега
          # стал бы «последним», и обновление предложило бы откат.
          NEWEST=$( { gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name'; echo "$TAG"; } \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 )
          if [ "$NEWEST" = "$TAG" ]; then LATEST=true; else LATEST=false; fi
          echo "Самая новая версия: $NEWEST, $TAG помечается Latest: $LATEST"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$LATEST" = true ]; then gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest; fi
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Axiom $TAG" --notes-file notes.md --generate-notes --latest="$LATEST"
          fi
