name: Островок на Linux

# Видео из чёлки на настоящем Linux без экрана (X11 и Wayland): вкладка с видео уходит в
# фон, видео выезжает из чёлки (debug-сборка, AXIOM_UI_HASH=peek), снимки экрана и журнал
# места вкладки под чёлкой — в артефакте. Тестовая страница, как YouTube, переставляет
# плеер в узком окне. Только вручную: Actions → «Островок на Linux» → ветка.
on:
  workflow_dispatch:

jobs:
  island:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        display: [x11, wayland]
        # before — скрипт страницы из main (как в выпуске), after — из этой ветки.
        script: [before, after]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Скрипт страницы из main
        if: matrix.script == 'before'
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- src/tabs/media.rs
      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev pkg-config build-essential \
            xvfb imagemagick sway grim ffmpeg pulseaudio pulseaudio-utils \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-gl
          dpkg -l | grep -E 'libwebkit2gtk-4.1-0|libgtk-3-0t64|sway ' | awk '{print $2, $3}'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - name: Тестовое видео
        run: ffmpeg -loglevel error -f lavfi -i testsrc=size=640x360:rate=30 -f lavfi -i sine=frequency=440 -t 60 -c:v libvpx -b:v 1M -c:a libvorbis .github/linux-gui/www/video.webm
      - name: Островок
        run: bash .github/linux-gui/island.sh ${{ matrix.display }} "$RUNNER_TEMP/island"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: island-${{ matrix.display }}-${{ matrix.script }}
          path: ${{ runner.temp }}/island
