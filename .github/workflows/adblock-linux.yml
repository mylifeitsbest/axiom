name: Реклама на Linux

# Блокировка рекламы в WebKitGTK на настоящем Linux без экрана: правила компилируются,
# рекламные запросы и элементы тестовой страницы не грузятся и не видны, обычные — на
# месте, в том числе после перезапуска с готовыми правилами; работает счётчик.
# Снимки экрана и журналы — в артефакте. Только вручную: Actions → «Реклама на Linux».
on:
  workflow_dispatch:

jobs:
  adblock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev pkg-config build-essential xvfb imagemagick
          dpkg -l | grep -E 'libwebkit2gtk-4.1-0' | awk '{print $2, $3}'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - name: Реклама
        run: bash .github/linux-gui/adblock.sh "$RUNNER_TEMP/adblock"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: adblock-linux
          path: ${{ runner.temp }}/adblock
